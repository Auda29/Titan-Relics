plugins {
    id 'fabric-loom' version '1.17.21'
}

version = '0.1.0-alpha.4.9'
group = 'de.relics'
base { archivesName = 'relics' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
    modImplementation 'maven.modrinth:lithostitched:1.8.0-fabric-21.1'
}

sourceSets.main {
    java.srcDirs = ['build/generated/java']
    resources.srcDirs = ['build/generated/resources']
}

sourceSets.test.java.srcDirs = ['build/generated/test']

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.debug = false
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

remapJar {
    archiveFileName = "relics-${project.version}+mc1.21.1.jar"
}

tasks.register('relicClasspath') {
    doLast {
        file('build/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath
    }
}

tasks.register('headlessWorldgenTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.relics.WorldgenTests'
    if (project.hasProperty('relicTestJava')) {
        executable = project.property('relicTestJava')
    }
}

// Shared regression tests have a plain Java main, not JUnit annotations.
test { failOnNoDiscoveredTests = false }
check { dependsOn headlessWorldgenTest }
