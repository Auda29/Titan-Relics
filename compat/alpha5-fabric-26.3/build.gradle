plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = providers.gradleProperty('relicVersion').orElse(new groovy.json.JsonSlurper().parse(file('../../src/main/resources/fabric.mod.json')).version as String).get()
group = 'de.relics'
base { archivesName = 'relics' }
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.2+26.3'
    implementation 'maven.modrinth:lithostitched:2.0.6-fabric-26.3'
    compileOnly 'maven.modrinth:modmenu:21.0.0'
}
sourceSets.main {
    java.srcDirs = ['build/generated/java']
    resources.srcDirs = ['build/generated/resources']
}
sourceSets.test.java.srcDirs = ['build/generated/test']
sourceSets.test.resources.srcDirs = ['build/generated/test-resources']
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.debug = false
    options.compilerArgs += ['-Xmaxerrs', '400']
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar { archiveFileName = "relics-${project.version}+mc26.3.jar" }
tasks.register('relicClasspath') {
    doLast { file('build/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
test { failOnNoDiscoveredTests = false }
tasks.register('portTestJar', Jar) {
    dependsOn testClasses
    from sourceSets.test.output
    archiveClassifier = 'port-tests-dev'
}

check { dependsOn portTestJar }
