name: Build alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pixel-art test dependency
        run: python -m pip install Pillow==12.0.0
      - name: Prepare checksum-verified Java compilation dependencies
        run: python tools/setup_worldgen_build.py --accept-downloads
      - name: Generate structures and build mod
        run: python tools/build.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build and verify Fabric 1.21.1 Alpha 5
        run: python tools/build_alpha5_port.py --loader fabric --minecraft 1.21.1 --java-home "$JAVA_HOME" --gradle gradle
      - name: Check reproducible Fabric 1.21.1 package
        run: |
          cp dist/SHA256SUMS-fabric-mc1.21.1.txt /tmp/relics-fabric1211-first.sha256
          python tools/build_alpha5_port.py --loader fabric --minecraft 1.21.1 --java-home "$JAVA_HOME" --gradle gradle --rerun-tasks
          cmp /tmp/relics-fabric1211-first.sha256 dist/SHA256SUMS-fabric-mc1.21.1.txt
      - name: Test generators and resources
        run: python -m unittest discover -s tests -v
      - name: Build and verify NeoForge 1.21.1 Alpha 5
        run: python tools/build_alpha5_port.py --loader neoforge --minecraft 1.21.1 --java-home "$JAVA_HOME" --gradle gradle
      - name: Check reproducible NeoForge 1.21.1 package
        run: |
          cp dist/SHA256SUMS-neoforge-mc1.21.1.txt /tmp/relics-neo1211-first.sha256
          python tools/build_alpha5_port.py --loader neoforge --minecraft 1.21.1 --java-home "$JAVA_HOME" --gradle gradle --rerun-tasks
          cmp /tmp/relics-neo1211-first.sha256 dist/SHA256SUMS-neoforge-mc1.21.1.txt
      - name: Test placement processor and reservations
        run: python tools/test_worldgen_java.py
      - name: Test gameplay items, recipes, ledger and static mixin targets (no server)
        run: python tools/test_gameplay.py
      - name: Test deterministic distribution and planning journal
        run: python tools/test_distribution.py
      - name: Test native World Tree animal spawning and population caps
        run: python tools/test_tree_animals_server.py --accept-eula --java-home "$JAVA_HOME" --artifact dist/relics-0.1.0-alpha.5.0+mc26.2.jar
      - name: Check reproducible package
        run: |
          cp dist/SHA256SUMS.txt /tmp/relics-first-build.sha256
          python tools/build.py
          cmp /tmp/relics-first-build.sha256 dist/SHA256SUMS.txt
      - name: Record package checksum
        run: cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        # Release assets are uploaded and checked independently. Account archive
        # quota must not hide the result of build/test/reproducibility checks.
        continue-on-error: true
        with:
          name: relics-alpha5-builds
          path: |
            dist/*.jar
            dist/SHA256SUMS.txt
