<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui);font-size:14px}button{color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius,6px);padding:6px 10px;cursor:pointer}button[aria-pressed=true]{outline:2px solid var(--chart-1)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.row{margin:14px 0}.label{display:flex;justify-content:space-between;margin-bottom:5px}.bar{height:18px;margin:3px 0;min-width:2px;border-radius:3px}.control{background:var(--chart-2)}.relic{background:var(--chart-1)}.legend{display:flex;gap:18px;color:var(--muted-foreground)}.dot{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}.hint{color:var(--muted-foreground);font-size:12px;line-height:1.5}#plot{min-height:430px}</style>
<div class="controls"><button aria-pressed="true" id="time">256 Chunks / Sekunden</button><button aria-pressed="false" id="ram">Prozessspeicher / GiB</button></div><div class="legend"><span><i class="dot control"></i>Ohne Relic</span><span><i class="dot relic"></i>Mit Relic</span></div><div id="plot" role="img"></div><p class="hint" id="hint"></p><script>
const rows=[{"name": "fabric-26.2", "n": 1, "time": {"control": 5.640999999999622, "relic": 5.640999999999622}, "ram": {"control": 1.2187080383300781, "relic": 3.2025985717773438}}, {"name": "neoforge-26.2", "n": 1, "time": {"control": 5.860000000000582, "relic": 5.842999999997119}, "ram": {"control": 0.9451904296875, "relic": 3.147411346435547}}, {"name": "fabric-1.21.1", "n": 1, "time": {"control": 6.485000000000582, "relic": 6.485000000000582}, "ram": {"control": 1.4128456115722656, "relic": 3.0046348571777344}}, {"name": "neoforge-1.21.1", "n": 1, "time": {"control": 6.328000000001339, "relic": 7.125}, "ram": {"control": 1.2765998840332031, "relic": 3.5062294006347656}}, {"name": "TerraVista", "n": 2, "time": {"control": 14.992500000000291, "relic": 15.82049999999981}, "ram": {"control": 2.2481002807617188, "relic": 3.3529891967773438}}, {"name": "Living World", "n": 2, "time": {"control": 17.25749999999971, "relic": 18.15649999999914}, "ram": {"control": 3.9780120849609375, "relic": 4.155067443847656}}];let mode='time';function draw(){const unit=mode==='time'?' s':' GiB',max=Math.max(...rows.flatMap(r=>Object.values(r[mode])))*1.12;document.querySelector('#plot').innerHTML=rows.map(r=>`<div class="row"><div class="label"><span>${r.name} <small>(${r.n} Seed${r.n>1?'s':''})</small></span><span>${r[mode].control.toFixed(2)} / ${r[mode].relic.toFixed(2)}${unit}</span></div><div class="bar control" style="width:${r[mode].control/max*100}%"></div><div class="bar relic" style="width:${r[mode].relic/max*100}%"></div></div>`).join('');document.querySelector('#plot').setAttribute('aria-label',mode==='time'?'Generierungszeit im A/B-Vergleich':'RSS-Spitzen im A/B-Vergleich');document.querySelector('#hint').textContent=mode==='time'?'Zeit bis zum vollständigen Laden von 256 angeforderten Chunks. Bei Modpacks Mittel aus zwei Seeds. Alle 16 Serverläufe bestanden die vorab festgelegten Budgets. Kleine Stichprobe auf einem PC.':'Höchster beobachteter RSS je Umgebung und Variante, über den gesamten Lauf. Modpack-Läufe enthalten zusätzliche Koloss- und Vorabgenerierungslast. 4 GiB Java-Heap sind keine Grenze des gesamten Prozessspeichers.';for(const key of ['time','ram'])document.getElementById(key).setAttribute('aria-pressed',key===mode)}for(const key of ['time','ram'])document.getElementById(key).onclick=()=>{mode=key;draw()};draw();</script></html>
